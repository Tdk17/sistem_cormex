name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Flutter stable
        shell: bash
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch stable "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter version
        run: flutter --version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Validate Parse build secrets
        env:
          PARSE_APPLICATION_ID: ${{ secrets.PARSE_APPLICATION_ID }}
          PARSE_JAVASCRIPT_KEY: ${{ secrets.PARSE_JAVASCRIPT_KEY }}
        shell: bash
        run: |
          if [ -z "$PARSE_APPLICATION_ID" ]; then
            echo "::error::GitHub Secret PARSE_APPLICATION_ID não configurado."
            exit 1
          fi
          if [ -z "$PARSE_JAVASCRIPT_KEY" ]; then
            echo "::error::GitHub Secret PARSE_JAVASCRIPT_KEY não configurado."
            exit 1
          fi
          echo "Parse build secrets configurados."

      - name: Build Flutter Web
        env:
          PARSE_APPLICATION_ID: ${{ secrets.PARSE_APPLICATION_ID }}
          PARSE_JAVASCRIPT_KEY: ${{ secrets.PARSE_JAVASCRIPT_KEY }}
        shell: bash
        run: |
          flutter build web \
            --release \
            --base-href "/sistem_cormex/" \
            --dart-define=PARSE_APPLICATION_ID="$PARSE_APPLICATION_ID" \
            --dart-define=PARSE_JAVASCRIPT_KEY="$PARSE_JAVASCRIPT_KEY"

      - name: Disable Jekyll
        run: touch build/web/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
